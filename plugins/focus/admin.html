<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>集中タイマーの履歴</title>
<body>
  <h1>集中タイマーの履歴</h1>
  <style>
    #history li { display: flex; align-items: center; gap: 10px; }
    #history li::before { display: none; }
    .tag { padding: 0 9px; border-radius: 10px; background: var(--ui-accent-soft); color: var(--ui-accent); font-size: 11px; font-weight: 700; line-height: 20px; }
    .tag.rest { background: color-mix(in srgb, var(--ui-ok) 14%, transparent); color: var(--ui-ok); }
    .when { font-variant-numeric: tabular-nums; }
    .empty { padding: 22px; border: 1px dashed var(--ui-line); border-radius: 14px; color: var(--ui-sub); text-align: center; }
  </style>
  <ol id="history"></ol>
  <p class="empty" id="empty" hidden>まだ記録はありません。集中タイマーで区切りを終えると、ここに残ります。</p>
  <script>
    window.addEventListener('message', ({source,data}) => {
      if (source !== parent || data?.id !== 'history' || !data.ok) return;
      const names = {focus: '集中', break: '休憩', 'long-break': '長い休憩'};
      const items = [...data.result.history].reverse();
      document.getElementById('history').replaceChildren(...items.map(item => {
        const row = document.createElement('li');
        const tag = document.createElement('span');
        tag.className = 'tag' + (item.phase === 'focus' ? '' : ' rest');
        tag.textContent = names[item.phase] || item.phase;
        const when = document.createElement('span');
        when.className = 'when';
        when.textContent = new Date(item.completedAt).toLocaleString('ja-JP');
        row.append(tag, when);
        return row;
      }));
      document.getElementById('empty').hidden = items.length > 0;
    });
    parent.postMessage({type:'kei:call', id:'history', action:'status', arguments:{}}, '*');
  </script>
</body>
</html>
