schemaVersion: 1
apiVersion: 1
id: kei.observation
name: "画面観察"
version: "0.1.1"
requiresFeatures: [config-schema-v1, vision-broker-v1]
permissions: [observation.read, observation.control, vision.describe]
actions:
  - {id: status, scope: observation.read}
  - {id: observation.context, scope: observation.read}
  - {id: configure, scope: observation.control}
  - {id: capture, scope: vision.describe}
entries:
  - id: observation
    title: "画面観察"
    slot: extensions
    icon: "◉"
    page: page.html
    actions: [status, configure, capture, observation.context]
  - id: observation-admin
    title: "画面観察設定"
    slot: admin
    icon: "◉"
    page: page.html
    actions: [status, configure]
