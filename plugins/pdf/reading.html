<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>読書</title>
<style>
  .section-title { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; font-size: 14px; }
  .section-title svg { width: 17px; height: 17px; color: var(--ui-accent); }
  #answer { font-family: var(--font-line); font-size: 15px; line-height: 1.8; }
  #plan-cards { display: grid; gap: 8px; margin-bottom: 12px; }
  .plan { padding: 12px 14px; border: 1px solid var(--ui-line); border-radius: 14px; background: var(--ui-panel-solid); }
  .plan-head { display: flex; align-items: baseline; gap: 10px; }
  .plan-title { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plan-count { font-size: 12px; color: var(--ui-sub); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; margin-top: 8px; border-radius: 3px; background: var(--ui-sunken); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: var(--ui-accent); }
  .plans-empty { padding: 14px; border: 1px dashed var(--ui-line); border-radius: 14px; color: var(--ui-sub); font-size: 13px; text-align: center; }
</style>
<body>
  <h1>読書</h1>
  <h2 class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14v10H10l-5 4z"/></svg>選んだ文章について聞く</h2>
  <form id="ask">
    <label>選択した文章 <textarea id="excerpt" required maxlength="12000"></textarea></label>
    <label>質問 <input id="question" required maxlength="4000"></label>
    <label>関連プラン <select id="plans"><option value="">なし</option></select></label>
    <button>質問する</button>
  </form>
  <output id="answer" aria-live="polite"></output>
  <h2 class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6c-2-1.3-4.5-1.6-7-1v13c2.5-.6 5-.3 7 1 2-1.3 4.5-1.6 7-1V5c-2.5-.6-5-.3-7 1zM12 6v13"/></svg>読書プラン</h2>
  <div id="plan-cards"></div>
  <form id="new">
    <label>本の名前 <input id="name" required maxlength="120"></label>
    <label>総ページ数 <input id="total" type="number" min="1" max="20000" required></label>
    <label>１日の目標 <input id="pace" type="number" min="1" max="20000" required></label>
    <button>プランを追加</button>
  </form>
  <form id="progress">
    <label>読んだページ <input id="page" type="number" min="0" required></label>
    <button>進捗を更新</button>
  </form>
  <output id="plans-status" aria-live="polite"></output>
  <script>
    const byId = id => document.getElementById(id);
    let source = null;
    let selectedPage = null;
    let requestIndex = 0;
    const requests = new Map();
    function call(action, args = {}) {
      const id = String(++requestIndex);
      return new Promise((resolve, reject) => {
        requests.set(id, {resolve, reject});
        parent.postMessage({type:'kei:call', id, action, arguments:args}, '*');
      });
    }
    window.addEventListener('message', ({source: sender, data}) => {
      if (sender !== parent) return;
      if (data?.type === 'kei:selection' && typeof data.text === 'string') {
        byId('excerpt').value = data.text;
        source = data.source ?? null;
        selectedPage = data.page ?? null;
        byId('question').focus();
      }
      if (data?.type !== 'kei:result') return;
      const pending = requests.get(data.id);
      requests.delete(data.id);
      if (!pending) return;
      const error = data.ok ? data.result?.error : data.error;
      if (error) pending.reject(Error(error.message));
      else pending.resolve(data.result);
    });
    byId('excerpt').addEventListener('input', () => { source = selectedPage = null; });
    async function refresh() {
      const current = byId('plans').value;
      const plans = await call('plans.list');
      byId('plans').replaceChildren(new Option('なし', ''), ...plans.map(plan =>
        new Option(plan.title + ' · ' + plan.currentPage + '/' + plan.totalPages, plan.id)));
      byId('plans').value = current;
      byId('plan-cards').replaceChildren(...(plans.length ? plans.map(plan => {
        const card = document.createElement('div');
        card.className = 'plan';
        const head = document.createElement('div');
        head.className = 'plan-head';
        const title = document.createElement('span');
        title.className = 'plan-title';
        title.textContent = plan.title;
        const count = document.createElement('span');
        count.className = 'plan-count';
        count.textContent = plan.currentPage + ' / ' + plan.totalPages + ' ページ';
        head.append(title, count);
        const bar = document.createElement('div');
        bar.className = 'bar';
        const fill = document.createElement('i');
        fill.style.width = Math.min(100, Math.round(100 * plan.currentPage / Math.max(1, plan.totalPages))) + '%';
        bar.append(fill);
        card.append(head, bar);
        return card;
      }) : [Object.assign(document.createElement('div'), {className: 'plans-empty', textContent: 'まだプランはありません。下のフォームから作れます。'})]));
    }
    byId('ask').onsubmit = async event => {
      event.preventDefault();
      const button = byId('ask').querySelector('button');
      button.disabled = true;
      try {
        const requestId = Array.from(crypto.getRandomValues(new Uint32Array(4)), n => n.toString(16)).join('-');
        const result = await call('selection.ask', {
          requestId, question:byId('question').value, planId:byId('plans').value || null,
          selection:{text:byId('excerpt').value, source, page:selectedPage},
        });
        byId('answer').textContent = result.reply;
      } catch (error) { byId('answer').textContent = error.message; }
      finally { button.disabled = false; }
    };
    byId('new').onsubmit = async event => {
      event.preventDefault();
      try {
        const plan = await call('plans.create', {title:byId('name').value,
          totalPages:Number(byId('total').value), pagesPerDay:Number(byId('pace').value)});
        await refresh();
        byId('plans').value = plan.id;
      } catch (error) { byId('plans-status').textContent = error.message; }
    };
    byId('progress').onsubmit = async event => {
      event.preventDefault();
      try {
        await call('plans.progress', {id:byId('plans').value, page:Number(byId('page').value)});
        await refresh();
      } catch (error) { byId('plans-status').textContent = error.message; }
    };
    refresh().catch(error => { byId('plans-status').textContent = error.message; });
  </script>
</body>
</html>
