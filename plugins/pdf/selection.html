<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>読書</title>
<body>
  <h1>読書</h1>
  <form id="ask">
    <label>選択した文章 <textarea id="excerpt" required maxlength="12000"></textarea></label>
    <label>質問 <input id="question" required maxlength="4000"></label>
    <label>関連プラン <select id="plans"><option value="">なし</option></select></label>
    <button>質問する</button>
  </form>
  <output id="answer" aria-live="polite"></output>
  <output id="plans-status" aria-live="polite"></output>
  <script>
    const byId = id => document.getElementById(id);
    let source = null;
    let selectedPage = null;
    let requestIndex = 0;
    const requests = new Map();
    function call(action, args = {}) {
      const id = String(++requestIndex);
      return new Promise((resolve, reject) => {
        requests.set(id, {resolve, reject});
        parent.postMessage({type:'kei:call', id, action, arguments:args}, '*');
      });
    }
    window.addEventListener('message', ({source: sender, data}) => {
      if (sender !== parent) return;
      if (data?.type === 'kei:selection' && typeof data.text === 'string') {
        byId('excerpt').value = data.text;
        source = data.source ?? null;
        selectedPage = data.page ?? null;
        byId('question').focus();
      }
      if (data?.type !== 'kei:result') return;
      const pending = requests.get(data.id);
      requests.delete(data.id);
      if (!pending) return;
      const error = data.ok ? data.result?.error : data.error;
      if (error) pending.reject(Error(error.message));
      else pending.resolve(data.result);
    });
    byId('excerpt').addEventListener('input', () => { source = selectedPage = null; });
    async function refresh() {
      const current = byId('plans').value;
      const plans = await call('plans.list');
      byId('plans').replaceChildren(new Option('なし', ''), ...plans.map(plan =>
        new Option(plan.title + ' · ' + plan.currentPage + '/' + plan.totalPages, plan.id)));
      byId('plans').value = current;
    }
    byId('ask').onsubmit = async event => {
      event.preventDefault();
      const button = byId('ask').querySelector('button');
      button.disabled = true;
      try {
        const requestId = Array.from(crypto.getRandomValues(new Uint32Array(4)), n => n.toString(16)).join('-');
        const result = await call('selection.ask', {
          requestId, question:byId('question').value, planId:byId('plans').value || null,
          selection:{text:byId('excerpt').value, source, page:selectedPage},
        });
        byId('answer').textContent = result.reply;
      } catch (error) { byId('answer').textContent = error.message; }
      finally { button.disabled = false; }
    };
    refresh().catch(error => { byId('plans-status').textContent = error.message; });
  </script>
</body>
</html>
