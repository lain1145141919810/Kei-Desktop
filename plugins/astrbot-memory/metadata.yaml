schemaVersion: 1
apiVersion: 1
id: kei.astrbot-memory
name: "AstrBot 記憶の引き継ぎ"
version: "0.1.0"
requiresFeatures: [plugin-pages-v1, config-schema-v1]
permissions: [astrbot.memory.read, astrbot.memory.handoff]
actions:
  - {id: status, scope: astrbot.memory.read}
  - {id: handoff, scope: astrbot.memory.handoff}
  - {id: handoff.status, scope: astrbot.memory.read}
  - {id: handoff.resume, scope: astrbot.memory.handoff}
entries:
  - id: memory-admin
    title: "AstrBot 記憶の引き継ぎ"
    slot: admin
    page: admin.html
    actions: [status, handoff, handoff.status, handoff.resume]
