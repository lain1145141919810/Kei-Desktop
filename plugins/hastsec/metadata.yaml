schemaVersion: 1
apiVersion: 1
id: kei.hastsec
name: "HAST-SEC 身体モーション"
version: "0.1.0"
requiresFeatures: [plugin-pages-v1, config-schema-v1]
permissions: [hastsec.solve, hastsec.preview, hastsec.settings]
actions:
  - {id: solve, scope: hastsec.solve}
  - {id: solve.poll, scope: hastsec.solve}
  - {id: solve.cancel, scope: hastsec.solve}
  - {id: prewarm, scope: hastsec.solve}
  - {id: catalog, scope: hastsec.solve}
  - {id: library, scope: hastsec.preview}
  - {id: preview, scope: hastsec.preview}
  - {id: preview.stop, scope: hastsec.preview}
  - {id: settings.get, scope: hastsec.settings}
  - {id: settings.save, scope: hastsec.settings}
motionProvider:
  entryId: motion-provider
  catalogAction: catalog
entries:
  - id: motion-provider
    title: "HAST-SEC モーションプロバイダー"
    slot: character-settings
    page: provider.html
    actions: [solve, solve.poll, solve.cancel, prewarm, catalog]
  - id: motion-admin
    title: "HAST-SEC 動作ライブラリ"
    slot: admin
    page: admin.html
    actions: [library, preview, preview.stop, settings.get, settings.save]
