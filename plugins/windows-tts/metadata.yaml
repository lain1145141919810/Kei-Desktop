schemaVersion: 1
apiVersion: 1
id: kei.windows-tts
name: "Windows SAPI Speech (TTS)"
version: "1.0.0"
requiresFeatures:
  - model-providers-v1
  - config-schema-v1
permissions:
  - model.provide.tts
actions:
  - id: tts.synthesize
    scope: model.provide.tts
modelProviders:
  - capability: tts
    action: tts.synthesize
    models:
      - sapi-auto
      - sapi-ja-jp
      - sapi-zh-cn
      - sapi-en-us
    requiresCredential: false
