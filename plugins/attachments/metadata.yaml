schemaVersion: 1
apiVersion: 1
id: kei.attachments
name: "添付ファイルの読み取り"
version: "0.1.1"
requiresFeatures: [attachments-v1, plugin-pages-v1]
permissions: [attachments.read]
actions:
  - {id: extract.start, scope: attachments.read}
  - {id: extract.status, scope: attachments.read}
  - {id: extract.cancel, scope: attachments.read}
entries:
  - id: extract
    title: "テキストの抜粋"
    slot: attachment
    icon: "文"
    page: page.html
    actions: [extract.start, extract.status, extract.cancel]
