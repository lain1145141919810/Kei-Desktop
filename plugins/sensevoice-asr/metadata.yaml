schemaVersion: 1
apiVersion: 1
id: kei.sensevoice-asr
name: "SenseVoice ONNX Speech Recognition (ASR)"
version: "1.0.0"
requiresFeatures:
  - model-providers-v1
  - config-schema-v1
permissions:
  - model.provide.asr
actions:
  - id: asr.transcribe
    scope: model.provide.asr
modelProviders:
  - capability: asr
    action: asr.transcribe
    models:
      - sensevoice-int8
    requiresCredential: false
