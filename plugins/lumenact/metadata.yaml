schemaVersion: 1
apiVersion: 1
id: kei.lumenact
name: "LumenAct 表情"
version: "0.1.0"
requiresFeatures: [plugin-pages-v1, config-schema-v1]
permissions: [lumenact.select, lumenact.preview, lumenact.settings]
actions:
  - {id: select, scope: lumenact.select}
  - {id: select.poll, scope: lumenact.select}
  - {id: select.cancel, scope: lumenact.select}
  - {id: status, scope: lumenact.preview}
  - {id: preview, scope: lumenact.preview}
  - {id: preview.poll, scope: lumenact.preview}
  - {id: preview.stop, scope: lumenact.preview}
  - {id: settings.get, scope: lumenact.settings}
  - {id: settings.save, scope: lumenact.settings}
entries:
  - id: expression-provider
    title: "LumenAct 表情プロバイダー"
    slot: character-settings
    page: provider.html
    actions: [select, select.poll, select.cancel]
  - id: expression-admin
    title: "LumenAct 表情プレビュー"
    slot: admin
    page: admin.html
    actions: [status, preview, preview.poll, preview.stop, settings.get, settings.save]
