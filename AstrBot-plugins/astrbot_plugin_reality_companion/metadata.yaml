name: astrbot_plugin_reality_companion
display_name: 我会来到你身边
author: menglimi
author_url: https://github.com/menglimi
version: 0.4.0
description: 面向 AstrBot 陪伴体系的现实设备联动插件，内置米家授权与设备控制，提供独立授权的本机音频播放、摄像头单帧观察、现实提醒、Android 移动端配对与前台位置上下文，并可与“我会永远陪着你”联动延续人格、关系和 TTS 能力。
desc: 让 Bot 在明确授权和任务边界内通过米家设备、本机音频、摄像头单帧、Android 移动端和现实提醒来到用户身边。
repo: https://github.com/menglimi/astrbot_plugin_reality_companion
category: AI 增强
tags:
  - 陪伴体系
  - 现实设备
  - 摄像头
  - 本机音频
  - 主动提醒
  - 隐私授权
  - Android 联动
icon: logo.png
support_platforms:
  - aiocqhttp
  - qq_official
astrbot_version: ">=4.22.0"
help: |
  私聊命令：
  - /现实触及
  - /现实触及 确认
  - /现实触及 撤销
  - /现实触及 摄像头
  - /现实触及 摄像头确认
  - /现实触及 摄像头测试
  - /现实触及 摄像头单帧
  - /现实触及 语音试听
  - /现实触及 位置检查
  - /现实触及 07:30 工作日

  兼容“陪伴 现实触及 ...”旧命令。音频和摄像头必须分别知情确认；摄像头只读取任务触发的单帧，默认不保存原图。
