<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src file:; media-src file: blob:">
<title>Kei Desktop</title><link rel="stylesheet" href="style.css"></head>
<body><aside><div id="portrait"></div><h1>Kei Desktop</h1></aside>
<main><header><select id="mode" aria-label="对话模式"><option value="chat">对话</option><option value="task">DSH 任务</option></select>
<details><summary>设置</summary><div class="menu"><button id="memory">长期记忆</button><button id="settings">打开接口配置</button><button data-media="portrait">替换立绘</button><button data-media="opening">替换开头画面</button><button data-media="ending">替换结尾画面</button></div></details></header>
<dialog id="memory-panel"><h2>长期记忆</h2><input id="note" maxlength="4000" placeholder="希望凯伊记住的事"><button id="save-note">保存</button><button id="import-memory">导入旧记忆库</button><div id="notes"></div><button id="close-memory">关闭</button></dialog><section id="log" aria-live="polite"></section><form><textarea required maxlength="16000" aria-label="消息" placeholder="输入消息"></textarea><button id="send">发送</button></form></main>
<div id="overlay" hidden></div><script src="ui.js"></script></body></html>
