<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src file:; media-src file: blob:">
<title>Kei Desktop</title><link rel="stylesheet" href="style.css"></head>
<body><aside><div id="portrait"></div><h1>Kei Desktop</h1></aside>
<main><header><select id="mode" aria-label="会話モード"><option value="chat">会話</option><option value="task">DSH タスク</option></select>
<details><summary>設定</summary><div class="menu"><button id="voice-settings">音声読み上げ設定</button><button id="copy-install">AI 用インストール指示をコピー</button><button id="memory">長期記憶</button><button id="settings">接続設定を開く</button><button data-media="portrait">立ち絵を変更</button><button data-media="opening">起動画面を変更</button><button data-media="ending">終了画面を変更</button></div></details></header>
<dialog id="voice-panel"><h2>音声読み上げ設定</h2>
<label><input id="v-enabled" type="checkbox"> 読み上げを有効にする</label>
<label>接続方式<select id="v-provider"><option value="gpt-sovits">GPT-SoVITS</option><option value="external">外部 TTS API</option></select></label>
<fieldset id="v-local"><legend>GPT-SoVITS</legend><label>接続先 URL<input id="v-url"></label><label>参照音声のパス<input id="v-referencePath"></label><label>参照音声の言語<input id="v-referenceLanguage"></label><label>参照音声の書き起こし<input id="v-referenceText"></label></fieldset>
<fieldset id="v-external"><legend>外部 TTS API</legend><label>接続先 URL<input id="v-externalUrl" placeholder="https://example.com/v1/audio/speech"></label><label>API キー（Bearer、任意）<input id="v-externalKey" type="password" autocomplete="off"></label><label><input id="v-clearKey" type="checkbox"> 保存済みキーを削除</label><label>本文フィールド名<input id="v-textField"></label><label>モデル（任意）<input id="v-model"></label><label>音声 ID（任意）<input id="v-voice"></label><label>追加パラメーター（JSON）<textarea id="v-extra" rows="2"></textarea></label></fieldset>
<p id="v-status" role="status"></p><button id="v-save">保存</button><button id="v-close">閉じる</button></dialog><dialog id="memory-panel"><h2>長期記憶</h2><input id="note" maxlength="4000" placeholder="ケイに覚えてほしいこと"><button id="save-note">保存</button><button id="import-memory">以前の記憶を取り込む</button><div id="notes"></div><button id="close-memory">閉じる</button></dialog><section id="log" aria-live="polite"></section><form><textarea required maxlength="16000" aria-label="メッセージ" placeholder="メッセージを入力"></textarea><button id="send">送信</button></form></main>
<div id="overlay" hidden></div><script src="ui.js"></script></body></html>
